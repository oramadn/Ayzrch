unbind r
bind r source-file ~/.config/tmux/tmux.conf

unbind C-b
set-option -g prefix C-s
bind C-s send-prefix

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1

# Renumber windows automatically when one is closed
set -g renumber-windows on

# Don't let programs/shell hijack window names (fixes windows all becoming "archlinux"
# and manual `prefix + ,` renames not sticking). Names are now explicit and permanent.
set-option -g allow-rename off
set-option -g automatic-rename off

set-option -g mouse on
set -g default-terminal "tmux-256color"
setw -g mode-keys vi
set-option -g history-limit 10000

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

set-option -g status-position top

set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
# Show the window NAME (#W) in the status bar, not the pane title (#T).
# Default here was #T, which the shell keeps overwriting with the hostname (archlinux),
# so `prefix + ,` renames appeared to do nothing.
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
# set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
# set -agF status-right "#{E:@catppuccin_status_battery}"

# Yazi support
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

set -g @plugin 'tmux-plugins/tpm'

# Source matugen after setting defaults
source-file ~/.config/tmux/colors.conf

run '~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux'
run '~/.config/tmux/plugins/tpm/tpm'
