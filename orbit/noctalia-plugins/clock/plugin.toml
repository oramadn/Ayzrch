id          = "orbit/clock"
name        = "Clock"
version     = "1.0.0"
plugin_api  = 14
author      = "orbit"
icon        = "clock"
description = "Time and date with an ordinal day, such as 08:36 19th of Sep."

[[widget]]
id    = "clock"
entry = "widget.luau"

  # Same click as the built-in clock, so this can stand in for it.
  [widget.actions]
  left = "panel-toggle control-center calendar"
