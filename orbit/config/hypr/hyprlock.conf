
 Source dynamically generated colors from Noctalia palette
source = ~/.config/hypr/hyprlock-colors.conf

# Source Orbit Wallpaper Engine background configuration
source = ~/.cache/orbit-wallpaper-engine/hyprlock-background.conf

general {
    hide_cursor = false
    ignore_empty_input = true
}

# Time label: displays current time (HH:MM format, updates every 1 second)
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_size = 50
    font_family = JetBrains Mono
    # Color sourced from hyprlock-colors.conf ($time_color = Noctalia accent color)
    color = $time_color

    position = 0, 130
    halign = center
    valign = center
}

# Date label: displays weekday and date (e.g., "Monday, August 18"), updates every 60 seconds
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    font_size = 14
    font_family = JetBrains Mono
    # Color sourced from hyprlock-colors.conf ($date_color = Noctalia secondary accent)
    color = $date_color

    position = 0, 85
    halign = center
    valign = center
}

# Password input field: main interactive element of lock screen
input-field {
    monitor =
    font_family = JetBrains Mono

    size = 260, 55

    outline_thickness = 2

    # outer_color: border/outline of input field (from hyprlock-colors.conf)
    outer_color = $border_color
    # inner_color: background fill of input field (dark surface color)
    inner_color = $surface_color
    # font_color: text color for password input/placeholder (light foreground)
    font_color = $text_color
    fade_on_empty = false
    dots_center = true
    placeholder_text =
    position = 0, 0
    halign = center
    valign = center
}
