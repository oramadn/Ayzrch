general {
    # Noctalia 5.x ships its own session lock, enabled by default, and claims
    # ext-session-lock-v1 on the logind lock signal. Upstream Orbit launches
    # hyprlock here, so both raced for the protocol: hyprlock lost ("we got
    # yeeten"), the failed lock tore the session down, and the wallpaper
    # renderer died with it. Noctalia owns locking on this machine; to hand it
    # back to hyprlock, restore the line below and set
    # [lockscreen] enabled = false in the Noctalia config.
    # No lock_cmd on purpose. Noctalia locks on the logind Lock signal by
    # itself, so anything registered here runs *in parallel* with that lock
    # rather than instead of it — which double-locked the session and skipped
    # the animation on the first pass. The idle listener below calls Orbit's
    # animated transition directly, and that transition engages Noctalia's lock
    # at the end via ORBIT_HYPRLOCK_BIN. An external `loginctl lock-session`
    # still locks, just without the animation.
    unlock_cmd = ~/.config/hypr/scripts/wallpaper-recover
    after_sleep_cmd = ~/.config/hypr/scripts/restore-dpms
}

listener {
    timeout = 600
    on-timeout = ~/.config/hypr/scripts/start-noctalia-lock
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
